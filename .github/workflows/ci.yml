name: CI

on:
  pull_request:
    branches: [dev, main, prod]
  push:
    branches: [dev, main, prod]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  route:
    name: Validate DMG release ref
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      app_environment: ${{ steps.version.outputs.app_environment }}
      dmg_name: ${{ steps.version.outputs.dmg_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and source branch
        run: Scripts/release.sh check-release-ref
      - name: Derive version and target environment
        id: version
        run: Scripts/release.sh version

  branch-schema:
    name: Verify branch CloudKit schema
    if: github.event_name == 'push' && github.ref_type == 'branch'
    uses: ./.github/workflows/cloudkit-schema.yml
    with:
      contract: ControlDroneMapping/CloudKitContract
      container: ${{ github.ref_name == 'dev' && 'staging' || 'production' }}
      partition: ${{ github.ref_name == 'dev' && 'development' || 'production' }}

  validate:
    name: Validate Deps, Schema & Build
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      ENGINES_STRICT: '1'
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Seed developer config template
        run: cp Config/Developer.xcconfig.example Config/Developer.xcconfig

      - name: Cache precompiled engines
        uses: actions/cache@v4
        with:
          path: |
            .build/OrthomosaicEngine
            .build/OrthomosaicPython
            .build/.orthomosaic_version
            .build/QGroundControl.app
            .build/.qgc_version
            .build/VariEngine
            .build/VariPython
            .build/.vari_version
          key: engines-arm64-${{ hashFiles('Config/engines.json') }}

      - name: Ensure all dependencies are valid
        run: Scripts/ensure-all-deps-valid.sh --download-only

      - name: Audit config, compile macOS + iOS & smoke-check engines
        run: Scripts/release.sh build-check

  release-schema:
    name: Verify release CloudKit schema
    needs: [route, validate]
    uses: ./.github/workflows/cloudkit-schema.yml
    with:
      contract: ControlDroneMapping/CloudKitContract
      container: ${{ needs.route.outputs.app_environment }}
      partition: production

  release:
    name: Release Signed & Notarized DMG (${{ needs.route.outputs.app_environment }})
    needs: [route, release-schema]
    runs-on: xcode-27
    environment: ${{ needs.route.outputs.app_environment }}
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_PREFIX: ${{ vars.APP_BUNDLE_PREFIX }}
      ICLOUD_CONTAINER_NAME: ${{ needs.route.outputs.app_environment == 'staging' && vars.CLOUDKIT_STAGING_CONTAINER_ID || vars.CLOUDKIT_PRODUCTION_CONTAINER_ID }}
      APP_ENVIRONMENT: ${{ needs.route.outputs.app_environment }}
      ENGINES_STRICT: '1'
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Cache precompiled engines
        uses: actions/cache@v4
        with:
          path: |
            .build/OrthomosaicEngine
            .build/OrthomosaicPython
            .build/.orthomosaic_version
            .build/QGroundControl.app
            .build/.qgc_version
            .build/VariEngine
            .build/VariPython
            .build/.vari_version
          key: engines-arm64-${{ hashFiles('Config/engines.json') }}

      - name: Set up Developer ID signing
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_PROFILE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_PROFILE_BASE64 }}
        run: Scripts/release.sh setup-signing

      - name: Ensure all dependencies are valid
        run: Scripts/ensure-all-deps-valid.sh --download-only

      - name: Archive with Developer ID signing
        env:
          MARKETING_VERSION: ${{ needs.route.outputs.marketing_version }}
          BUILD_NUMBER: ${{ needs.route.outputs.build_number }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: Scripts/release.sh archive

      - name: Verify app signatures, entitlements & engine self-checks
        env:
          MARKETING_VERSION: ${{ needs.route.outputs.marketing_version }}
        run: Scripts/release.sh verify-app dist/ControlDroneMapping.app

      - name: Notarize & staple app bundle
        run: Scripts/release.sh notarize dist/ControlDroneMapping.app

      - name: Package, sign, notarize & verify DMG
        env:
          APP_PATH: dist/ControlDroneMapping.app
          DMG_PATH: dist/${{ needs.route.outputs.dmg_name }}
          SKIP_ENGINE_SELF_CHECKS: '1'
        run: |
          Scripts/release.sh dmg
          Scripts/release.sh sign-dmg "$DMG_PATH"
          Scripts/release.sh notarize "$DMG_PATH"
          Scripts/release.sh verify-dmg "$DMG_PATH"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.route.outputs.dmg_name }}
          path: |
            dist/${{ needs.route.outputs.dmg_name }}
            dist/${{ needs.route.outputs.dmg_name }}.sha256
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_flag=()
          if [[ "${{ needs.route.outputs.prerelease }}" == "true" ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/${{ needs.route.outputs.dmg_name }}" \
            "dist/${{ needs.route.outputs.dmg_name }}.sha256" \
            --title "ControlDroneMapping $GITHUB_REF_NAME" \
            --generate-notes \
            ${prerelease_flag[@]+"${prerelease_flag[@]}"}

      - name: Clean up signing credentials
        if: always()
        run: Scripts/release.sh cleanup-signing

