services:
  arducopter:
    container_name: arducopter-sitl
    image: ardupilot-sitl-4.5.6:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5760:5760"
      - "127.0.0.1:5762:5762"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOME_LAT=1.1057040126131052
      - HOME_LON=104.1303576072984
      - HOME_ALT=${HOME_ALT:-35.0}
      - HOME_YAW=${HOME_YAW:-0.0}
      - SPEEDUP=${SPEEDUP:-1}
    entrypoint:
      - "/ardupilot/build/sitl/bin/arducopter"
    command:
      - "-S"
      - "--model"
      - "+"
      - "--speedup"
      - "${SPEEDUP:-1}"
      - "--defaults"
      - "/ardupilot/Tools/autotest/default_params/copter.parm"
      - "--home"
      - "1.1057040126131052,104.1303576072984,${HOME_ALT:-35.0},${HOME_YAW:-0.0}"
      - "--uartA"
      - "tcp:0"
      - "--uartC"
      - "udpclient:host.docker.internal:14550"